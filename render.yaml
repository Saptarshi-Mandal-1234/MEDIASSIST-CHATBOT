# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mediassist
    runtime: node
    plan: free
    rootDir: mediassist-backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: APP_USERNAME
        value: owner
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
